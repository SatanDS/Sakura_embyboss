# Separate TV virtual host. Install the TLS certificate before enabling.
server {
    listen 80;
    server_name tv-api.dusheng.lol;
    return 301 https://tv-api.dusheng.lol$request_uri;
}

server {
    listen 443 ssl;
    server_name tv-api.dusheng.lol;
    ssl_certificate /etc/letsencrypt/live/tv-api.dusheng.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv-api.dusheng.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;

    location ^~ /api/dushengtv/v1/ {
        # Auth links contain short-lived secrets. Do not log request URLs.
        access_log off;
        proxy_pass http://127.0.0.1:8840;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
    location / {
        return 404;
    }
}
