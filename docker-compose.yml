services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:5.7}
    container_name: mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:-susu}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-embyboss}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - ./db:/var/lib/mysql

  embyboss:
    build:
      context: .
      dockerfile: Dockerfile
    image: sakura_embyboss:local
    container_name: embyboss
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mysql
    environment:
      TGBOT_STRIPE_SECRET_KEY: ${TGBOT_STRIPE_SECRET_KEY:-}
      TGBOT_STRIPE_WEBHOOK_SECRET: ${TGBOT_STRIPE_WEBHOOK_SECRET:-}
      TGBOT_PAYMENT_CODE_KEY: ${TGBOT_PAYMENT_CODE_KEY:-}
    volumes:
      - ./config.json:/app/config.json
      - ./log:/app/log
      - ./db_backup:/app/db_backup
      # Emby 4.9/SenPlayer: uncomment and replace with the host directory
      # that contains Emby's data/authentication.db, then set
      # emby_auth_db_path in config.json to the matching /emby-auth path.
      # - /host/path/to/emby-config:/emby-auth:ro
