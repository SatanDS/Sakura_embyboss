services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:5.7}
    container_name: mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:-susu}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-embyboss}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - ./db:/var/lib/mysql

  embyboss:
    build:
      context: .
      dockerfile: Dockerfile
    image: sakura_embyboss:local
    container_name: embyboss
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mysql
    environment:
      TGBOT_STRIPE_SECRET_KEY: ${TGBOT_STRIPE_SECRET_KEY:-}
      TGBOT_STRIPE_WEBHOOK_SECRET: ${TGBOT_STRIPE_WEBHOOK_SECRET:-}
      TGBOT_PAYMENT_CODE_KEY: ${TGBOT_PAYMENT_CODE_KEY:-}
      TGBOT_POLYGON_RPC_URL: ${TGBOT_POLYGON_RPC_URL:-}
      TGBOT_BSC_RPC_URL: ${TGBOT_BSC_RPC_URL:-}
      TGBOT_TONCENTER_API_KEY: ${TGBOT_TONCENTER_API_KEY:-}
      TGBOT_BINANCE_API_KEY: ${TGBOT_BINANCE_API_KEY:-}
      TGBOT_BINANCE_API_SECRET: ${TGBOT_BINANCE_API_SECRET:-}
      TGBOT_DANMU_API_URL: ${TGBOT_DANMU_API_URL:-}
      TGBOT_DANMU_API_TOKEN: ${TGBOT_DANMU_API_TOKEN:-}
      TGBOT_LIVEKIT_URL: ${TGBOT_LIVEKIT_URL:-}
      TGBOT_LIVEKIT_API_KEY: ${TGBOT_LIVEKIT_API_KEY:-}
      TGBOT_LIVEKIT_API_SECRET: ${TGBOT_LIVEKIT_API_SECRET:-}
    volumes:
      - ./config.json:/app/config.json
      - ./log:/app/log
      - ./db_backup:/app/db_backup
      # Emby 4.9/SenPlayer: uncomment and replace with the host directory
      # that contains Emby's data/authentication.db, then set
      # emby_auth_db_path in config.json to the matching /emby-auth path.
      # - /host/path/to/emby-config:/emby-auth:ro

  # Optional room voice SFU. Enable with `docker compose --profile voice up -d livekit`.
  livekit:
    profiles:
      - voice
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.11}
    container_name: livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - ${LIVEKIT_TURN_CERT_DIR:-/etc/letsencrypt/live/turn-voice-api.dusheng.lol}:/etc/livekit/certs:ro
